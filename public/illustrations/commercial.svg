<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" class="w-full h-auto">
  <rect width="320" height="240" rx="16" fill="#E3F4F5"/>
  <line x1="20" y1="210" x2="300" y2="210" stroke="#0E7C86" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Immeuble de bureaux moderne -->
  <rect x="70" y="55" width="110" height="155" rx="6" fill="#FFFFFF" stroke="#0E7C86" stroke-width="3.5"/>
  <rect x="180" y="95" width="80" height="115" rx="6" fill="#FFFFFF" stroke="#0E7C86" stroke-width="3.5"/>

  <!-- Fenêtres bureau principal -->
  <g fill="#E3F4F5" stroke="#0A5A62" stroke-width="1.5">
    <rect x="85" y="75" width="20" height="18" rx="2"/>
    <rect x="115" y="75" width="20" height="18" rx="2"/>
    <rect x="145" y="75" width="20" height="18" rx="2"/>

    <rect x="85" y="105" width="20" height="18" rx="2"/>
    <rect x="115" y="105" width="20" height="18" rx="2"/>
    <rect x="145" y="105" width="20" height="18" rx="2"/>

    <rect x="85" y="135" width="20" height="18" rx="2"/>
    <rect x="115" y="135" width="20" height="18" rx="2"/>
    <rect x="145" y="135" width="20" height="18" rx="2"/>
  </g>

  <!-- Portes d'entrée vitrées -->
  <rect x="105" y="170" width="40" height="40" rx="2" fill="#0E7C86"/>
  <line x1="125" y1="170" x2="125" y2="210" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Fenêtres petit immeuble -->
  <g fill="#E3F4F5" stroke="#0A5A62" stroke-width="1.5">
    <rect x="195" y="115" width="18" height="16" rx="2"/>
    <rect x="225" y="115" width="18" height="16" rx="2"/>
    <rect x="195" y="145" width="18" height="16" rx="2"/>
    <rect x="225" y="145" width="18" height="16" rx="2"/>
  </g>

  <!-- Reflets et étincelle -->
  <path d="M230 45L233 55L243 58L233 61L230 71L227 61L217 58L227 55Z" fill="#FFB703"/>
  <circle cx="50" cy="90" r="12" fill="#FFFFFF" stroke="#0E7C86" stroke-width="2"/>
</svg>
